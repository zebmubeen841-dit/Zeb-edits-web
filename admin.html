<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <!-- ویب سائٹ کا فاو آئیکن (Favicon) -->
<link rel="icon" type="image/png" href="favicon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Upload Services & PDFs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            padding: 20px;
        }
        .admin-container {
            max-width: 600px;
            margin: 40px auto;
            background: #1f2937;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #d4af37;
        }
        h2 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e5e7eb;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #0b0f19;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background: #f3f4f6;
            color: #111827;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Admin Upload Panel</h2>
        <form>
            <div class="form-group">
                <label>سروس یا نوٹس کا نام (Title):</label>
                <input type="text" placeholder="مثلاً: Office Automation Notes">
            </div>

            <div class="form-group">
                <label>تفصیل درج کریں (Description):</label>
                <textarea placeholder="تفصیل یہاں لکھیں..."></textarea>
            </div>

            <div class="form-group">
                <label>تھمب نیل تصویر منتخب کریں (Upload Image):</label>
                <input type="file" accept="image/*">
            </div>

            <div class="form-group">
                <label>پی ڈی ایف فائل منتخب کریں (Upload PDF File):</label>
                <input type="file" accept=".pdf">
            </div>

            <button type="submit" class="btn-submit">محفوظ کریں اور اپ لوڈ کریں (Publish)</button>
        </form>

        <a href="index.html" class="back-link">← مین ویب سائٹ پر واپس جائیں</a>
    </div>

</body>
</html>
